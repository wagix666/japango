<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8fafc">
    <meta name="description" content="Master Japanese effortlessly with JapanGo. Hiragana, Katakana, travel phrases, everyday vocabulary, and quizzes with Sinhala & English guides.">
    <title>JapanGo Japanese · 日本語学習</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="firebase-config.js"></script>
    <script type="module" src="firebase-auth.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- Ambient glowing background mesh -->
    <div class="ambient-glow" aria-hidden="true">
      <div class="glow-orb glow-1"></div>
      <div class="glow-orb glow-2"></div>
      <div class="glow-orb glow-3"></div>
    </div>

    <!-- Celebration confetti canvas -->
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="sidebar-top">
          <a class="brand" href="#home" aria-label="JapanGo Japanese home">
            <span class="brand-mark" aria-hidden="true">
              <span class="brand-mark-char">日</span>
              <span class="brand-mark-glow"></span>
            </span>
            <div class="brand-copy">
              <strong>JapanGo</strong>
              <small>JAPANESE · 日本語</small>
            </div>
          </a>
          <div class="brand-badge">PRO EDITION</div>
        </div>

        <div class="nav-caption" data-i18n="workspace">YOUR WORKSPACE</div>
        <nav class="primary-nav" id="side-nav"></nav>

        <div class="sidebar-bottom">
          <div class="offline-note">
            <span class="status-dot"></span>
            <span data-i18n="offlineReady">Lessons ready offline</span>
          </div>
          <div class="sidebar-controls">
            <button class="theme-toggle-btn" id="sidebar-theme-toggle" type="button" aria-label="Toggle dark/light theme" title="Toggle theme">
              <span class="theme-icon light-icon" aria-hidden="true">☀️</span>
              <span class="theme-icon dark-icon" aria-hidden="true">🌙</span>
              <span class="theme-label" id="sidebar-theme-label">Theme</span>
            </button>
            <button class="profile-button" id="profile-button" type="button" data-view="profile">
              <span class="avatar">学</span>
              <span class="profile-copy">
                <strong id="profile-name" data-i18n="learner">Learner</strong>
                <small id="profile-detail">Login / Account</small>
              </span>
              <span class="settings-glyph" aria-hidden="true">›</span>
            </button>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="topbar-intro">
            <p class="eyebrow" data-i18n="today">YOUR JAPANESE JOURNEY</p>
            <p class="date-line" id="today-label"></p>
          </div>
          <div class="topbar-actions">
            <button class="topbar-theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark/light theme" title="Toggle theme">
              <span class="theme-icon light-icon" aria-hidden="true">☀️</span>
              <span class="theme-icon dark-icon" aria-hidden="true">🌙</span>
            </button>
            <button class="icon-button" id="mobile-settings" type="button" aria-label="Language and settings">⚙</button>
          </div>
        </header>
        <div class="content" id="app-content" tabindex="-1"></div>
      </main>
    </div>

    <nav class="mobile-nav" id="mobile-nav" aria-label="Main navigation"></nav>
    <div id="modal-root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
